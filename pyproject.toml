# Project manifest — declares every third-party package the pipeline imports, so
# the environment rebuilds from a clean checkout with `uv sync`. uv.lock pins the
# exact resolved versions; the floors below say "at least this, newer is fine."
#
# Floors rather than exact pins (==) because this project is being built now, not
# reproducing a validated historical run. Once the pipeline has been hand-checked
# against a real company end-to-end, tighten the extraction-critical packages
# (edgartools, beautifulsoup4, lxml) to == so a silent parser change can't move
# section boundaries under you.
[project]
name = "public-equity-research"
version = "0.1.0"
description = "Five-year narrative history of a public company from its SEC filings: narrative brief, timeline, discussion points"
requires-python = ">=3.13"

dependencies = [
    # --- EDGAR access ---
    "edgartools>=5.35",       # ticker -> CIK, submissions API, filing HTML + accession metadata
    # --- HTML-first section extraction (see CLAUDE.md: parse HTML, not .txt renditions) ---
    "beautifulsoup4>=4.14",   # section boundary location and text cleanup
    "lxml>=6.1",              # fast, lenient HTML parser backend for BeautifulSoup
    # --- structured intermediate layer ---
    # NOTE: keep every comment below on ONE line. `uv add` rewrites this array and
    # flattens the indentation of continuation comments, which mangles them.
    "pydantic>=2.13",         # validates the year-ledger schema (SPEC.md s3) so a bad record crashes loudly
    # --- narrative signal extraction ---
    "anthropic>=0.116",       # Claude API: strategic priorities, incentive metrics, notable language
    # --- year-over-year risk factor diffing (SPEC.md section 2, "Risk") ---
    "rapidfuzz>=3.14",        # fuzzy-match risk factors across years: reworded vs unchanged boilerplate
    # --- PDF fallback (added 2026-08-04; pypdf tried first and rejected) ---
    "pdfminer-six>=20260107", # FY2022 MORN letter is PDF-only; see src/pdf_text.py for why not pypdf
    # --- environment / platform ---
    "truststore>=0.10",       # use the Windows cert store, fixes corporate-SSL failures in httpx
    "python-dotenv>=1.0",     # load EDGAR_IDENTITY and ANTHROPIC_API_KEY from .env
    "markdown>=3.7",
    "xhtml2pdf>=0.2.16",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
pipeline = "equity_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The distribution is named "public-equity-research" (hyphens, per PyPI convention)
# but the importable package directory is "equity_research" (underscores, a valid
# Python identifier) — hatchling can't infer that mapping from the project name
# alone, so the wheel target is spelled out explicitly.
[tool.hatch.build.targets.wheel]
packages = ["src/equity_research"]

[tool.uv]
# An installable package (src/equity_research/), not just a collection of loose
# scripts — `python -m equity_research.<module>` and the modules' own imports of
# each other both depend on it being installed rather than merely present on disk.
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ONLY *_test.py — deliberately NOT pytest's usual `test_*.py` as well.
#
# The files named test_*.py in tests/ are standalone scripts: they do their work
# in main() and report "N passed, M failed", rather than exposing test_* functions.
# Letting pytest collect them would import all eight for nothing — it would find
# no test functions, report "no tests ran" for each, and pay their import cost.
#
# tests/suite_test.py is the pytest entry point. It runs each of those scripts as
# a subprocess and asserts the check COUNT as well as the result, which is the
# property `pytest --collect-only` structurally cannot see. See that file's
# docstring for why the count is the part that matters.
python_files = ["*_test.py"]
