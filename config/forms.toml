# WHAT THIS FILE IS
# Which filings enter the pipeline at all. Encodes SPEC.md section 1: the four
# in-scope form types, and the 8-K item filter that keeps a large filer's dozens
# of routine 8-Ks per year from drowning the signal.

# ---------------------------------------------------------------------------
# In-scope forms
# ---------------------------------------------------------------------------
# EDGAR treats "10-K" and "10-K/A" (an amendment) as different form types.
# include_amendments controls whether the /A variants come along. Amendments
# matter here: a restated 10-K is itself a narrative event.

[[forms]]
form = "10-K"
why = "Management's own account of strategy and risk"
include_amendments = true
cadence = "annual"

[[forms]]
form = "DEF 14A"
why = "What the board actually incentivizes; board composition"
include_amendments = true
cadence = "annual"

[[forms]]
form = "ARS"
why = "Annual report to shareholders — the leadership letter, unfiltered by disclosure convention"
include_amendments = false
cadence = "annual"
# ARS is filed inconsistently. Many companies furnish the shareholder letter as
# an EX-13 exhibit to the 10-K, or as a 8-K/ARS combination, or not to EDGAR at
# all. Discovery must report which of these applies rather than assume ARS
# exists. If it does not, the letter may be recoverable from a 10-K exhibit.
fallback = "10-K exhibit EX-13"
optional = true

[[forms]]
form = "8-K"
why = "Discrete material events between annual filings"
include_amendments = true
cadence = "event-driven"
# 8-Ks are the one form type that MUST be filtered. See [eight_k] below.
requires_item_filter = true

# ---------------------------------------------------------------------------
# SCOPE EXTENSION beyond SPEC.md section 1
# ---------------------------------------------------------------------------
# SPEC.md names four in-scope forms. The three below were added deliberately on
# 2026-08-04 after discovery surfaced them, and are NOT part of the original
# spec. They are recorded here rather than in code so the widened scope is
# visible and reversible — delete these three blocks to return to spec scope.
#
# Consequence for the outputs: coverage claims must say "the seven form types in
# config/forms.toml", not "the forms in SPEC.md".

[[forms]]
form = "DEFA14A"
why = "Additional proxy soliciting material. Carries supplemental compensation disclosure and vote-related communication that does not appear in the DEF 14A itself"
include_amendments = false
cadence = "annual"
optional = true

[[forms]]
form = "UPLOAD"
why = "SEC staff comment letter to the company. The regulator formally questioning a disclosure is a governance signal, and the topic questioned is itself narrative evidence"
include_amendments = false
cadence = "event-driven"
optional = true

[[forms]]
form = "CORRESP"
why = "The company's written reply to SEC staff comments. Management explaining its own disclosure choices, in its own words, under regulatory pressure"
include_amendments = false
cadence = "event-driven"
optional = true

# ---------------------------------------------------------------------------
# 8-K item filter (SPEC.md section 1, "8-K filtering")
# ---------------------------------------------------------------------------
# Only 8-Ks reporting one or more of these items get fetched and processed.
# EDGAR's submissions JSON exposes an "items" field per 8-K, so this filter can
# be applied at the metadata stage — before downloading anything.

[eight_k]

# Items that put an 8-K in scope for full processing.
include_items = [
    "1.01",  # entry into a material definitive agreement
    "1.02",  # termination of a material definitive agreement
    "2.01",  # completion of acquisition or disposition of assets
    "2.05",  # costs associated with exit or disposal activities (restructuring)
    "5.02",  # departure/appointment/election of directors and officers
    "5.07",  # submission of matters to a vote of security holders
]

# Items that are in scope only conditionally — the item number alone does not
# tell you whether the content is strategic. 7.01 (Reg FD) and 8.01 (other
# events) carry both major strategic announcements and wholly routine press
# releases. These get fetched, then triaged on the exhibit's content.
# Log every triage decision; a silent drop here loses real events.
conditional_items = [
    "7.01",  # Regulation FD disclosure
    "8.01",  # other events
]

# Items logged for their DATE ONLY — never fetched, never processed. The
# earnings-release cadence is timeline context (a missed or delayed release is
# itself a signal), but the releases themselves are financial, not narrative,
# and this is not a financial-extraction project.
date_only_items = [
    "2.02",  # results of operations and financial condition (earnings release)
]

# ---------------------------------------------------------------------------
# Triage of the conditional 7.01/8.01 filings (src/equity_research/triage_8k.py)
# ---------------------------------------------------------------------------
# Added 2026-08-05. `conditional_items` above says these filings get fetched and
# then judged on content; this is the judgment, and it is deterministic.
#
# THE ONE RULE THAT MATTERS: the only decision this stage is allowed to make
# confidently is "read it". `date_only` requires positive evidence of a routine
# filing AND the absence of every material signal. Anything unrecognised is read.
# A false "read" costs a few cents; a false "date_only" silently deletes a
# corporate event from the history, and nothing downstream could ever detect it.
#
# WHY POSITION MATTERS. Matching on keywords alone over-fires badly here. These
# filings include Morningstar's Reg FD investor Q&A, where management discusses
# past acquisitions at length — so "acquisition of" appears in dozens of
# documents that announce nothing. A press release, by contrast, states its
# subject in the headline. So a match is scored STRONG inside the headline window
# and a MENTION after it. Only strong matches drive the material routing;
# mentions are recorded, because a suppressed observation is not a clean one.

[eight_k.triage]

# Characters from the start of a document treated as its headline. A press
# release puts its subject in the first line or two; 1,200 chars comfortably
# covers a headline plus dateline without reaching into the body.
headline_window_chars = 1200

# Hard ceiling on any single document sent to a model. Exists because 8-K
# exhibits are unbounded: the FY2025 credit-agreement 8-K carries a
# 622,000-character EX-10.1. A document over the cap is SKIPPED AND RECORDED,
# never silently truncated — a truncated agreement reads as a complete one.
max_document_chars = 120000

# Which signals make a filing material. A strong match on any of these forces
# `read`, whatever else the document looks like.
material_signals = ["deal", "capital_allocation", "leadership"]

# Which signals mark a filing routine. Sufficient for `date_only` ONLY when no
# material signal fired at all.
routine_signals = ["dividend"]

# Signals that mean "narrative content worth reading" without implying a
# discrete event. Routed to the investor_qa field, not to events.
narrative_signals = ["investor_qa", "presentation"]

# Regex patterns, case-insensitive. Keep them anchored to announcement phrasing
# rather than topic words: "acquisition" matches any discussion of the past,
# "completes acquisition of" matches an announcement.
[eight_k.triage.patterns]

investor_qa = [
    'investor\s+questions?\s+and\s+answers',
    'answers?\s+to\s+(additional\s+)?(investor\s+)?(inquiries|questions)',
    'investor\s*q\s*&\s*a',
    'we\s+encourage\s+current\s+shareholders',
]

deal = [
    '\b(plans?|intends?|agreed|agrees)\s+to\s+acquire\b',
    '\bto\s+acquire\b',
    '\bcompletes?\s+(the\s+)?acquisition\b',
    '\bhas\s+(completed|closed)\s+(the\s+)?acquisition\b',
    '\bentered\s+into\s+a[n]?\s+[A-Za-z ]{0,40}(Purchase|Merger|Termination|Tender\s+Offer)\s+Agreement\b',
    # Named agreements, standalone. Added after auditing the log: the 2023-01-31
    # Japan filing reads "entered into a (i) Termination Agreement", and the
    # enumerator "(i) " defeats the [A-Za-z ] run above. That filing was still
    # read — the unrecognised-defaults-to-read fallback caught it — but it was
    # logged as "no signal matched", which understates the evidence.
    '\b(Termination|Tender\s+Offer|Asset\s+Purchase|Share\s+Purchase|Merger)\s+Agreement\b',
    '\bstrategic\s+alliance\b',
    '\bdivest(iture|ed|ing)?\b',
    '\bsale\s+of\s+(its|the)\s+\w+\s+business\b',
    '\bjoint\s+venture\b',
]

capital_allocation = [
    '\bauthoriz(ed|es)\s+a?\s*(new\s+)?\$?[\d.,]*\s*(million|billion)?\s*share\s+repurchase\b',
    '\b(new|additional)\s+\$[\d.,]+\s*(million|billion)\s+share\s+repurchase\s+program\b',
    '\bstock\s+split\b',
    '\bspecial\s+dividend\b',
    '\b(senior\s+notes|credit\s+facility|term\s+loan)\s+offering\b',
]

leadership = [
    '\bappoint(ed|s|ment)\s+of\s+\w+\s+as\b',
    '\bnamed\s+(as\s+)?(chief|president|chair)\b',
    '\bwill\s+(step\s+down|retire|depart)\b',
    '\bresign(ed|ation)\b',
    '\bsuccessor\s+to\b',
]

dividend = [
    '(declares|increases|announces)\s+.{0,30}quarterly\s+(cash\s+)?dividend',
    'quarterly\s+(cash\s+)?dividend\s+of\s+[\d.]+\s*cents',
]

presentation = [
    'investor\s+presentation',
    'investor\s+day',
]

# Boilerplate stripped before a document is sent to a model, and before its
# content length is measured. All of it is verbatim-identical across filings, so
# leaving it in would pay for the same text 75 times and bury the signal.
[eight_k.triage.boilerplate]

# The 8-K cover page: from the top of the document to the first item heading.
# ~2,270 chars in every MORN filing in the window.
body_starts_at_item = '(?i)Item\s+[0-9]\.[0-9]{2}'

# The signature block and everything after it.
body_ends_at = '(?i)\bSIGNATURES\b'

# The forward-looking-statements caution, which the 7.01 filings repeat in full
# every time. Runs from the heading to whichever of these comes next.
#
# `Investor Questions` was added 2026-08-05 after this pattern set silently
# destroyed eleven filings. In the FY2021-FY2022 filings the caution is followed
# directly by the Q&A heading — no Item 9.01, no numbered question — so neither
# original alternative matched, and the stripper discarded everything from the
# caution to the end of the document: 6,500 characters including the entire Q&A.
# See the CONSERVATIVE FALLBACK note in src/equity_research/triage_8k.py; the pattern fix and the
# fallback are independent, and the fallback is the one that makes this safe.
forward_looking_start = '(?i)Caution\s+Concerning\s+Forward-Looking\s+Statements'
forward_looking_end = '(?i)(Item\s+9\.01|Investor\s+Questions|\b1\.\s+[A-Z])'

# Filing-agent artifacts at the head of an extracted exhibit, e.g.
# "EX-99.1 2 iq-may72025.htm EX-99.1 Document generated by Workiva Inc".
exhibit_head = '(?i)^EX-99\.\d\s+\d+\s+\S+\.htm\s+EX(HIBIT)?[\s-]*99[.-]\d\s*(Exhibit\s+99\.\d\s*)?(Document generated by Workiva Inc\s*)?'

# Workiva image placeholders left behind by HTML-to-text conversion.
image_placeholder = '\S+\.jpg\b'

# ---------------------------------------------------------------------------
# Gap-analysis signals (PROMPT.md milestone 1)
# ---------------------------------------------------------------------------
# Forms NOT processed for content, but whose mere presence in the window must be
# surfaced during discovery because it reframes everything else. An S-4 in the
# window means M&A; an NT 10-K means the company missed a filing deadline.

[gap_signals]
flag_forms = [
    "S-1",     # registration statement — IPO or major securities offering
    "S-4",     # registration for a merger/exchange offer — strong M&A signal
    "S-3",     # shelf registration — financing capacity
    "NT 10-K", # notification of late filing — a governance/controls signal
    "NT 10-Q",
    "8-K12B",  # succession of a new issuer, e.g. reincorporation or holdco
    "25-NSE",  # exchange delisting notice
    "SC 13D",  # activist stake — often precedes the changes this pipeline tracks
    "SC 14D9", # response to a tender offer
]
