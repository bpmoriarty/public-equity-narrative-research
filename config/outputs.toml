# Output-stage configuration (milestone 5).
#
# Read-only to the pipeline, like every other file in config/. Change behaviour
# here rather than in src/.

[pack]

# The model the token count is measured against. It must be the model the
# generation stage actually calls: tokenisation differs between model families,
# so counting against one and sending to another gives a number that looks
# authoritative and is wrong.
model = "claude-opus-5"

# How large the pack may get, in tokens.
#
# The context window is NOT the binding constraint. A 1M-token window leaves
# roughly 958,000 usable after the system prompt, the ask and room to answer —
# but quality degrades long before that. The measured MORN pack was 352,194
# tokens, and 7 of 98 quotations in the first generation pass came back
# defective: subtly misquoted, or attributed to the wrong year. Recall across a
# very long payload is the limit, and it arrives quietly, as plausible prose
# that does not match the source.
#
# So these are quality thresholds, not capacity ones:
#
#   warn_tokens  the pack is entering the range where quote defects were
#                observed. Still builds; prints its composition so the largest
#                contributors are visible.
#   max_tokens   refuse. A pack this size can still be sent, and the model will
#                still answer confidently — that is the problem.
#
# Raising these is a decision about how much unverified prose is acceptable, so
# it belongs here in config where it is visible, rather than in a constant.
warn_tokens = 400_000
max_tokens = 600_000

[timeline]
# Two records describe the same event when they share a date, come from DIFFERENT
# filings, and their descriptions are at least this similar (rapidfuzz
# token_set_ratio, 0-100).
#
# 55 IS MEASURED, NOT CHOSEN. Every different-filing pair sharing a date in the
# MORN window was scored, and the sorted similarities have their widest gap in the
# relevant range between 59.6 and 48.5 — eleven points. Above it sit nine pairs that
# are all genuinely one event reported twice (the LCD contingent payment, the
# Commodity & Energy divestiture, the DBRS settlements, the $500M buyback, the 2022
# and 2025 credit-agreement refinancings, the MJKK unwind, the Shenzhen
# restructuring). Below it sits the covenant detail attached to a credit agreement,
# which is a different row. 55 is the middle of that gap.
merge_similarity = 55

# SAME-FILING RECORDS ARE NEVER MERGED, at any similarity. A filing does not report
# the same event twice, so two records from one accession sharing a date are two
# events that happened that day. The clearest case in this window scores 61.7 — a
# single 8-K reporting both a Contract Services Agreement and a Separation Agreement
# with the same officer on 2023-02-01. A similarity-only rule would have merged
# them and lost one; the different-filing requirement separates them cleanly.
require_different_filing = true

# Same-date pairs from different filings that fall BELOW the threshold are reported
# as possible duplicates rather than merged or dropped. Set false to stop reporting
# them (they are still never merged).
report_possible_duplicates = true
# Raised from 40 to 45 after reading the first output. At 40 the list included two
# pairs matching a credit agreement against an officer's departure that happened to
# share a date — obviously unrelated, and the kind of noise that teaches a reader to
# skip the list. At 45 what remains is the two genuinely arguable pairs, both a
# credit agreement against its own covenant terms. A reporting threshold, not a
# correctness one: nothing below it was ever going to be merged either way.
possible_duplicate_floor = 45

# Undated rows are NEVER merged, at any similarity, and this is the floor above which
# near-identical undated pairs get REPORTED for a human instead.
#
# 95 is high on purpose. Among the 26 undated rows the two top-scoring pairs are 98.9
# and 97.4, and they sit on opposite sides of the truth: 98.9 is one SmartX impairment
# reported by two filings, and 97.4 is two DIFFERENT years of dividend guidance whose
# wording is templated and differs only in an amount and a year. A margin of 1.5
# points, so no threshold can separate them and merging is refused outright.
#
# At a floor of 85 this list fills with the dividend-guidance family — five entries of
# noise around one real duplicate — and a reader learns to skip it. At 95 it holds two
# entries, one of each kind, which is both short enough to read and a standing
# demonstration of why the merge refuses.
undated_report_floor = 95

# Rows whose subject is an advisory vote on executive compensation. The timeline
# marks these and footnotes them, because of the year offset recorded as binding
# constraint 3: the vote held at the meeting in year N approves the compensation paid
# for year N-1. The row's own date is the MEETING date and is correct as printed —
# what needs saying is which year's pay it concerned.
say_on_pay_patterns = [
    '(?i)\badvisory vote\b.{0,40}\bcompensation\b',
    '(?i)\b(executive )?compensation\b.{0,30}\bapproved\b',
    '(?i)\bsay-on-pay\b',
]

[timeline.routine]
# Routine annual-meeting governance. These are TAGGED, never dropped — the timeline
# can render them compactly or omit them, but the decision belongs to the stage that
# writes the document, not to this one. A silent drop here would lose real events,
# the same reasoning that governs src/triage_8k.py.
patterns = [
    '(?i)\bdirector nominees?\b.{0,40}\belected\b',
    '(?i)\belection of director\b',
    '(?i)\bratification of\b.{0,60}\b(accounting firm|auditors?)\b',
    '(?i)\badvisory vote\b.{0,40}\bcompensation\b',
    '(?i)\bannual shareholders.{0,3} meeting held\b',
    '(?i)\b(quarterly|regular) cash dividend\b',
]

# Patterns that OVERRIDE a routine match. Asymmetric on purpose: mislabelling a real
# change as routine could drop it from the timeline, while mislabelling routine
# governance as material only adds a row someone skims past.
#
# This exists because of a specific near-miss. "Shareholders approved the Morningstar,
# Inc. Amended and Restated 2011 Stock Incentive Plan at the 2021 Annual Shareholders'
# Meeting" is an INCENTIVE PLAN CHANGE — one of the row types SPEC.md section 4b names
# explicitly — and it sits on the same date, in the same meeting, as four genuinely
# routine votes. An earlier plan to drop "the annual-meeting vote outcomes" would have
# taken it with them.
material_overrides = [
    '(?i)\b(stock|equity|incentive|compensation|severance)\s+(plan|policy)\b',
    '(?i)\bamended and restated\b',
    '(?i)\bshareholder proposal\b',
    '(?i)\bspecial (cash )?dividend\b',
    '(?i)\b(initiat|increas|suspend|discontinu|reduc)\w*\s+.{0,20}dividend\b',
]


# ---------------------------------------------------------------------------
# [verify] -- milestone 5f, src/verify_outputs.py
#
# Every value here is a property of the DELIVERABLE SPEC, not of the company.
# Nothing company-specific belongs in this block: which years have a shareholder
# letter, which disclose reportable segments, and which facts are low confidence
# are all read out of data/pack/pack.json at run time, because they change with
# the company and with every re-extraction.
# ---------------------------------------------------------------------------
[verify]

# The documents this stage checks. timeline.md is absent on purpose -- it is
# rendered deterministically by src/render_timeline.py, which asserts its own
# completeness before writing, so there is no model output in it to verify.
documents = ["narrative-brief.md", "discussion-points.md"]

# Constraint 1. A paragraph resting on a low-confidence fact has to say so. These
# are the ways a document can honestly say it; a paragraph citing such a fact and
# containing none of them is a hard failure.
low_confidence_flag_pattern = '(?:low[- ]confidence|unverified|indicative|not established|treated as indicative|boundaries are unverified)'

# Constraint 3. A say-on-pay result for fiscal year N is voted at the meeting in
# N+1, so a vote claim without a date is off by a year. Accepts "9 May 2025",
# "May 9, 2025" and a bare year.
date_pattern = '(?:\b\d{1,2}\s+\w+\s+20\d\d\b|\b\w+\s+\d{1,2},\s+20\d\d\b|\b20\d\d\b)'

# Constraint 4. How the Regulation FD register may be named. Required to appear
# before the first QA- citation, not in every paragraph -- see the module
# docstring: requiring it per paragraph flagged 23 of 36 and would be ignored.
reg_fd_pattern = '(?:regulation fd|reg fd|voluntary disclosure)'

# Constraint 4b, the subject words that make a run of year/number pairs a claim
# about investor Q&A volume rather than about the company.
qa_subject_pattern = '(?:question|answer|investor q&a|reg fd|regulation fd)'

# Share of a paragraph's citations that must be QA- before it is listed for
# review as resting mostly on voluntary disclosure. Review only, never a failure.
qa_majority_share = 0.5

# SPEC.md 4a and 4c. The brief carries an explicit word target; discussion-points
# does not, so its range is wide enough only to catch a truncated or runaway
# document rather than to enforce a length. Sub-tables come last: in TOML,
# everything after a [verify.x] header belongs to that sub-table, so a scalar
# written below one would silently land in the wrong place.
[verify.word_range]
"narrative-brief.md" = [1500, 2500]
"discussion-points.md" = [800, 8000]

# SPEC.md 4a and 4c again: the sections each document must actually contain.
# Matched case-insensitively as substrings, so the writer can phrase a heading
# naturally as long as the section is there.
[verify.required_headings]
"narrative-brief.md" = [
    "## Where",              # where the company stood at the start of the window
    "## The arc",
    "## Where it stands now",
    "## What the filings raise",
]
"discussion-points.md" = [
    "## Observations",
    "## Open questions",
    "## What management appears to prioritise",
    "diverge",               # the stated-vs-paid-for section SPEC.md calls the point
]

# ===========================================================================
# PDF rendering  (src/render_pdf.py)
# ===========================================================================
# Presentation only. The PDFs are a second rendering of output/*.md and carry no
# content the Markdown does not — src/render_pdf.py asserts that before writing, by
# extracting the text back out of each finished PDF and checking every fact id
# survived. A PDF that silently dropped a citation would look perfectly fine.
#
# SCALARS FIRST, SUB-TABLES LAST. Same trap this file already documents under
# [verify.word_range]: in TOML everything after a [pdf.page] header belongs to that
# sub-table, so a scalar written below one lands somewhere it was never meant to and
# nothing complains. Writing this block the wrong way round put `default_font_pt`
# inside [pdf.page] on the first attempt.
[pdf]
default_page = "letter portrait"
default_font_pt = 10.5

# Page geometry per document. `timeline.md` is landscape because its table carries a
# long description column AND a source column; in portrait the description wraps to
# five or six lines a row and the table stops being scannable. The prose documents
# stay portrait — they are read as prose, not looked up like a reference table.
[pdf.page]
"timeline.md" = "letter landscape"

# Base font size in points. The timeline is smaller because it is read by lookup
# rather than continuously.
[pdf.font_pt]
"timeline.md" = 7.6
